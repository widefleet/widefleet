packages:
  - apps/*
  - packages/*
  - starters/*

strictPeerDependencies: true

peerDependencyRules:
  allowedVersions:
    # Bits UI and LayerChart use runed's framework-independent exports; verified with SvelteKit 3 and browser checks.
    "runed@0.35.1>@sveltejs/kit": "3.0.0"
    "runed@0.37.1>@sveltejs/kit": "3.0.0"

patchedDependencies:
  blume@2.1.1: patches/blume@2.1.1.patch
  # Persist terminal workflow failures and prevent steps from starting after pause
  # so local pause/resume and replay match the native workflow contract.
  miniflare@5.20261001.0-alpha: patches/miniflare@5.20261001.0-alpha.patch

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - "@better-auth/core@1.7.12"
  - "@better-auth/drizzle-adapter@1.7.12"
  - "@better-auth/kysely-adapter@1.7.12"
  - "@better-auth/memory-adapter@1.7.12"
  - "@better-auth/mongo-adapter@1.7.12"
  - "@better-auth/oauth-provider@1.7.12"
  - "@better-auth/prisma-adapter@1.7.12"
  - "@better-auth/telemetry@1.7.12"
  - better-auth@1.7.12
  - better-call@1.4.4
  - "@better-auth/sso@1.7.12"
