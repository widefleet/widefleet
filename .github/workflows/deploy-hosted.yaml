name: Deploy Hosted

on:
  workflow_dispatch:
    inputs:
      installation:
        description: Installation configuration
        type: choice
        options: [widefleet]
        required: true
      ref:
        description: Merged commit or tag to deploy
        type: string
        default: main
        required: true

permissions:
  contents: read

concurrency:
  group: hosted-${{ inputs.installation }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: hosted-${{ inputs.installation }}
    env:
      PLATFORM_USAGE_REPORTING: "false"
      PLATFORM_CRASH_REPORTING: "false"
      WIDEFLEET_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a merged revision
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.8.2
      - name: Install dependencies
        run: |
          npm install --global pnpm@12.4.2
          pnpm install --frozen-lockfile
      - name: Build control plane and runtime
        run: pnpm --filter @platform/control-plane build:cloudflare
      - name: Install or update Hosted
        env:
          INSTALLATION: ${{ inputs.installation }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          WIDEFLEET_PROVISIONING_TOKEN: ${{ secrets.CLOUDFLARE_PROVISIONING_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          PLATFORM_ENCRYPTION_KEY: ${{ secrets.PLATFORM_ENCRYPTION_KEY }}
          APP_COOKIE_SECRET: ${{ secrets.APP_COOKIE_SECRET }}
          WIDEFLEET_CONTROL_TOKEN: ${{ secrets.WIDEFLEET_CONTROL_TOKEN }}
          PLATFORM_BOOTSTRAP: ${{ secrets.PLATFORM_BOOTSTRAP }}
        run: pnpm --filter @platform/control-plane exec node tools/deploy-hosted.ts "../../infra/hosted/$INSTALLATION.json"
