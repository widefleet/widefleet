name: Check and publish Widefleet

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

cache-mode: none

# A tag releases in one run at a time. Main pushes check in parallel; only their
# canary publication waits in its own queue.
concurrency:
  group: publish-widefleet-${{ github.ref_type == 'tag' && github.ref || github.run_id }}
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

env:
  RELEASE_TAG: ${{ github.ref_name }}
  PLATFORM_USAGE_REPORTING: "false"
  PLATFORM_CRASH_REPORTING: "false"
  WIDEFLEET_TELEMETRY_DISABLED: "1"

jobs:
  prepare:
    if: github.repository == 'widefleet/widefleet' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the version tag and its main-branch source
        id: release
        run: bash tools/check-release.sh
      - name: Prepare the draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/prepare-release.sh

  build-native:
    name: Build and test macOS and Windows CLI
    needs: prepare
    cache-mode: read
    uses: ./.github/workflows/cli-platforms.yaml
    with:
      ref: ${{ needs.prepare.outputs.revision }}
      platforms: '["darwin-arm64", "darwin-x64", "win32-x64-msvc"]'

  build-binaries:
    name: Compile shared Linux release binaries
    needs: prepare
    runs-on: ubuntu-24.04
    cache-mode: read
    steps:
      - name: Set release build directories
        run: |
          echo "RELEASE_CARGO_CACHE=$RUNNER_TEMP/release-cargo" >> "$GITHUB_ENV"
          echo "RELEASE_BINARIES=$RUNNER_TEMP/release-binaries" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: docker/setup-docker-action@v5.5.0
        with:
          version: v29.8.1
      - name: Restore the release Cargo cache
        uses: actions/cache/restore@v5.1.0
        with:
          path: ${{ env.RELEASE_CARGO_CACHE }}
          key: release-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('infra/agent/Dockerfile', 'tools/build-release-binaries.sh', 'rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-${{ hashFiles('crates/**') }}
          restore-keys: |
            release-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('infra/agent/Dockerfile', 'tools/build-release-binaries.sh', 'rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-
            release-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('infra/agent/Dockerfile', 'tools/build-release-binaries.sh', 'rust-toolchain.toml') }}-
      - name: Compile the agent and CLI in the pinned release toolchain
        run: bash tools/build-release-binaries.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-binaries
          path: ${{ env.RELEASE_BINARIES }}/release-binaries.tar
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  build:
    name: Build and test Linux CLI
    needs: [prepare, build-binaries]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the release source
        run: |
          bash tools/check-release.sh
          echo "RELEASE_BINARIES=$RUNNER_TEMP/release-binaries" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 26.8.2
          package-manager-cache: false
      - uses: docker/setup-docker-action@v5.5.0
        with:
          version: v29.8.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-binaries
          path: ${{ env.RELEASE_BINARIES }}
      - name: Verify the shared Linux release binaries
        run: bash tools/load-release-binaries.sh
      - name: Check source and package the release executables
        run: |
          npm install --global pnpm@12.4.2
          pnpm install --frozen-lockfile
          pnpm check
          pnpm package:cli --binary "$RELEASE_BINARIES/source/target/release/widefleet" --output "$RUNNER_TEMP/cli"
          mkdir -p target/debug
          cp "$RELEASE_BINARIES/source/target/release/"{widefleet,platform-agent} target/debug/
      - name: Verify npm package selection and the generated app
        run: RUN_CLI_PACKAGE_TESTS=1 CLI_PACKAGE_DIR="$RUNNER_TEMP/cli" pnpm test:cli-package
      - name: Prepare the packaged CLI deployment test
        run: |
          pnpm --filter @platform/control-plane build
          pnpm exec playwright install --with-deps chromium
          bash tools/install-celld.sh
          docker build --file infra/runtime/Dockerfile --tag app-platform-runtime:0.1.0 .
          docker compose -f infra/test/compose.yaml up -d --wait
      - name: Test the npm archive through a real local deployment
        run: |
          # The runtime fixture needs root; pnpm installs into its disposable global directory.
          sudo env -u SUDO_USER "PATH=$PATH" "CI=true" \
            "DOCKER_HOST=$(docker context inspect --format '{{.Endpoints.docker.Host}}')" \
            "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" \
            "CLI_NPM_PACKAGE=$RUNNER_TEMP/cli/widefleet-$VERSION.tgz" \
            PLATFORM_USAGE_REPORTING=false PLATFORM_CRASH_REPORTING=false WIDEFLEET_TELEMETRY_DISABLED=1 \
            RUN_RUNTIME_TESTS=1 pnpm exec vitest run apps/control-plane/tests/runtime/deployment.test.ts
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: tested-cli
          path: |
            ${{ runner.temp }}/cli/*.tgz*
            ${{ runner.temp }}/cli/*.tar.gz*
          if-no-files-found: error
          retention-days: 3
          overwrite: true
      - name: Stop disposable services
        if: always()
        run: docker compose -f infra/test/compose.yaml down --volumes

  build-images:
    needs: [prepare, build-binaries]
    cache-mode: read
    uses: ./.github/workflows/build-release-images.yaml
    with:
      ref: ${{ needs.prepare.outputs.revision }}
      recover-existing: true
      binaries-artifact: release-binaries

  publish-images:
    needs: [prepare, build, build-native, build-images]
    uses: ./.github/workflows/publish-images.yaml
    with:
      ref: ${{ needs.prepare.outputs.revision }}
      tag: ${{ github.ref_name }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  publish:
    name: Publish CLI to npm
    needs: [prepare, build, build-native, build-images]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the release again before publication
        run: |
          bash tools/check-release.sh
          echo "CLI_RELEASE_DIRECTORY=$RUNNER_TEMP/cli" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 26.8.2
          package-manager-cache: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: tested-cli
          path: ${{ env.CLI_RELEASE_DIRECTORY }}
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: ${{ env.CLI_RELEASE_DIRECTORY }}
      - name: Publish using npm trusted publishing and verify installation
        run: |
          npm install --global pnpm@12.4.2
          bash tools/publish-cli.sh

  release:
    name: Publish the completed GitHub Release
    needs: [prepare, publish, publish-images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the release source before final publication
        run: |
          bash tools/check-release.sh
          echo "CLI_RELEASE_DIRECTORY=$RUNNER_TEMP/cli" >> "$GITHUB_ENV"
          echo "RELEASE_IMAGES=$RUNNER_TEMP/release-images" >> "$GITHUB_ENV"
          echo "RELEASE_RUNTIME=$RUNNER_TEMP/app-runtime" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: tested-cli
          path: ${{ env.CLI_RELEASE_DIRECTORY }}
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: ${{ env.CLI_RELEASE_DIRECTORY }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-manifest
          path: ${{ env.RELEASE_IMAGES }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: tested-app-runtime
          path: ${{ env.RELEASE_RUNTIME }}
      - name: Attach verified downloads and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/publish-github-release.sh

  publish-overviews:
    name: Sync Docker Hub overviews
    needs: [prepare, release]
    runs-on: ubuntu-24.04
    concurrency:
      group: dockerhub-overviews
      cancel-in-progress: false
      # An older retry must not cancel a newer release's pending sync.
      queue: max
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - name: Publish the repository overviews
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash tools/sync-dockerhub-overviews.sh

  main-changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      checks: ${{ steps.changes.outputs.checks }}
      canary: ${{ steps.changes.outputs.canary }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks and publication from the complete push
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 tools/check-main-changes.py

  main-checks:
    needs: main-changes
    if: needs.main-changes.outputs.checks == 'true' || needs.main-changes.outputs.canary == 'true'
    cache-mode: write
    uses: ./.github/workflows/check-suites.yaml
    with:
      full-checks: ${{ needs.main-changes.outputs.checks == 'true' }}

  source-and-integration:
    name: Main source and integration
    needs: [main-changes, main-checks]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected check to pass
        env:
          CHANGES_RESULT: ${{ needs.main-changes.result }}
          CHECKS_RESULT: ${{ needs.main-checks.result }}
          RUN_CHECKS: ${{ needs.main-changes.outputs.checks }}
          CANARY: ${{ needs.main-changes.outputs.canary }}
        run: |
          [[ "$CHANGES_RESULT" == success ]]
          case "$RUN_CHECKS:$CANARY:$CHECKS_RESULT" in
            true:true:success|true:false:success|false:true:success|false:false:skipped) ;;
            *) exit 1 ;;
          esac

  publish-canary:
    name: Publish CLI to npm canary
    needs: [main-changes, main-checks, source-and-integration]
    if: github.repository == 'widefleet/widefleet' && github.ref == 'refs/heads/main' && needs.main-changes.outputs.canary == 'true'
    runs-on: ubuntu-24.04
    # Runs can reach this queue out of push order; one that arrives after a newer
    # canary skips publication.
    concurrency:
      group: publish-widefleet-canary
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 26.8.2
          package-manager-cache: false
      - name: Resolve the tested canary version
        run: |
          python3 tools/prepare-cli-canary.py
          echo "CLI_RELEASE_DIRECTORY=$RUNNER_TEMP/cli" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: ${{ env.CLI_RELEASE_DIRECTORY }}
      - name: Publish the tested packages exclusively to canary
        env:
          NPM_DIST_TAG: canary
        run: |
          npm install --global pnpm@12.4.2
          bash tools/publish-cli.sh
