name: Publish CLI to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable GitHub release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      verify_only:
        description: Verify an existing npm version without publishing it again
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-cli-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
  PLATFORM_USAGE_REPORTING: "false"
  PLATFORM_CRASH_REPORTING: "false"
  WIDEFLEET_TELEMETRY_DISABLED: "1"

jobs:
  build:
    if: >-
      github.repository == 'widefleet/widefleet' &&
      ((github.event_name == 'release' && !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the published release and its main-branch source
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/check-release.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.8.2
          package-manager-cache: false
      - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5
        with:
          version: v29.8.1
      - name: Check source and build the release executables
        run: |
          npm install --global pnpm@12.4.2
          pnpm install --frozen-lockfile
          pnpm check
          export RELEASE_CARGO_CACHE="$RUNNER_TEMP/release-cargo"
          export RELEASE_BINARIES="$RUNNER_TEMP/release-binaries"
          bash tools/build-release-binaries.sh
          pnpm package:cli --binary "$RELEASE_BINARIES/source/target/release/widefleet" --output "$RUNNER_TEMP/cli"
          mkdir -p target/debug
          cp "$RELEASE_BINARIES/source/target/release/"{widefleet,platform-agent} target/debug/
      - name: Prepare the packaged CLI deployment test
        run: |
          pnpm --filter @platform/control-plane build
          pnpm exec playwright install --with-deps chromium
          bash tools/install-celld.sh
          docker build --file infra/runtime/Dockerfile --tag app-platform-runtime:0.1.0 .
          docker compose -f infra/test/compose.yaml up -d --wait
      - name: Test the npm archive through a real local deployment
        run: |
          sudo env "PATH=$PATH" "CI=true" \
            "DOCKER_HOST=$(docker context inspect --format '{{.Endpoints.docker.Host}}')" \
            "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" \
            "CLI_NPM_PACKAGE=$RUNNER_TEMP/cli/widefleet-$VERSION.tgz" \
            PLATFORM_USAGE_REPORTING=false PLATFORM_CRASH_REPORTING=false WIDEFLEET_TELEMETRY_DISABLED=1 \
            RUN_RUNTIME_TESTS=1 pnpm exec vitest run apps/control-plane/tests/runtime/deployment.test.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-cli
          path: |
            ${{ runner.temp }}/cli/*.tgz*
            ${{ runner.temp }}/cli/*.tar.gz*
          if-no-files-found: error
          retention-days: 3
          overwrite: true
      - name: Stop disposable services
        if: always()
        run: docker compose -f infra/test/compose.yaml down --volumes

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.build.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the release again before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/check-release.sh
          echo "CLI_RELEASE_DIRECTORY=$RUNNER_TEMP/cli" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.8.2
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-cli
          path: ${{ env.CLI_RELEASE_DIRECTORY }}
      - name: Attach the tested CLI archives and checksums to the GitHub Release
        if: ${{ !inputs.verify_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/upload-release-assets.sh \
            "$CLI_RELEASE_DIRECTORY/widefleet-$VERSION.tgz" \
            "$CLI_RELEASE_DIRECTORY/widefleet-$VERSION.tgz.sha256" \
            "$CLI_RELEASE_DIRECTORY/widefleet-cli-$VERSION-linux-x64.tar.gz" \
            "$CLI_RELEASE_DIRECTORY/widefleet-cli-$VERSION-linux-x64.tar.gz.sha256"
      - name: Publish using npm trusted publishing and verify installation
        env:
          VERIFY_ONLY: ${{ inputs.verify_only || false }}
        run: |
          npm install --global pnpm@12.4.2
          bash tools/publish-cli.sh
