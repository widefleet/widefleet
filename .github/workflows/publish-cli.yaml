name: Publish Widefleet

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

cache-mode: none

concurrency:
  group: publish-widefleet-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RELEASE_TAG: ${{ github.ref_name }}
  PLATFORM_USAGE_REPORTING: "false"
  PLATFORM_CRASH_REPORTING: "false"
  WIDEFLEET_TELEMETRY_DISABLED: "1"

jobs:
  prepare:
    if: github.repository == 'widefleet/widefleet'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the version tag and its main-branch source
        id: release
        run: bash tools/check-release.sh
      - name: Prepare the draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/prepare-release.sh

  build-native:
    name: Build and test macOS and Windows CLI
    needs: prepare
    uses: ./.github/workflows/cli-platforms.yaml
    with:
      ref: ${{ needs.prepare.outputs.revision }}
      platforms: '["darwin-arm64", "darwin-x64", "win32-x64-msvc"]'

  build:
    name: Build and test Linux CLI
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the release source
        run: bash tools/check-release.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.8.2
          package-manager-cache: false
      - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5
        with:
          version: v29.8.1
      - name: Check source and build the release executables
        run: |
          npm install --global pnpm@12.4.2
          pnpm install --frozen-lockfile
          pnpm check
          export RELEASE_CARGO_CACHE="$RUNNER_TEMP/release-cargo"
          export RELEASE_BINARIES="$RUNNER_TEMP/release-binaries"
          bash tools/build-release-binaries.sh
          pnpm package:cli --binary "$RELEASE_BINARIES/source/target/release/widefleet" --output "$RUNNER_TEMP/cli"
          mkdir -p target/debug
          cp "$RELEASE_BINARIES/source/target/release/"{widefleet,platform-agent} target/debug/
      - name: Verify npm package selection and the generated app
        run: RUN_CLI_PACKAGE_TESTS=1 CLI_PACKAGE_DIR="$RUNNER_TEMP/cli" pnpm test:cli-package
      - name: Prepare the packaged CLI deployment test
        run: |
          pnpm --filter @platform/control-plane build
          pnpm exec playwright install --with-deps chromium
          bash tools/install-celld.sh
          docker build --file infra/runtime/Dockerfile --tag app-platform-runtime:0.1.0 .
          docker compose -f infra/test/compose.yaml up -d --wait
      - name: Test the npm archive through a real local deployment
        run: |
          # The runtime fixture needs root; pnpm installs into its disposable global directory.
          sudo env -u SUDO_USER "PATH=$PATH" "CI=true" \
            "DOCKER_HOST=$(docker context inspect --format '{{.Endpoints.docker.Host}}')" \
            "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" \
            "CLI_NPM_PACKAGE=$RUNNER_TEMP/cli/widefleet-$VERSION.tgz" \
            PLATFORM_USAGE_REPORTING=false PLATFORM_CRASH_REPORTING=false WIDEFLEET_TELEMETRY_DISABLED=1 \
            RUN_RUNTIME_TESTS=1 pnpm exec vitest run apps/control-plane/tests/runtime/deployment.test.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-cli
          path: |
            ${{ runner.temp }}/cli/*.tgz*
            ${{ runner.temp }}/cli/*.tar.gz*
          if-no-files-found: error
          retention-days: 3
          overwrite: true
      - name: Stop disposable services
        if: always()
        run: docker compose -f infra/test/compose.yaml down --volumes

  build-images:
    needs: prepare
    cache-mode: read
    uses: ./.github/workflows/build-release-images.yaml
    with:
      ref: ${{ needs.prepare.outputs.revision }}
      recover-existing: true

  publish-images:
    needs: [prepare, build, build-native, build-images]
    uses: ./.github/workflows/publish-images.yaml
    with:
      ref: ${{ needs.prepare.outputs.revision }}
      tag: ${{ github.ref_name }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  publish:
    name: Publish CLI to npm
    needs: [prepare, build, build-native, build-images]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the release again before publication
        run: |
          bash tools/check-release.sh
          echo "CLI_RELEASE_DIRECTORY=$RUNNER_TEMP/cli" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.8.2
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-cli
          path: ${{ env.CLI_RELEASE_DIRECTORY }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: ${{ env.CLI_RELEASE_DIRECTORY }}
      - name: Publish using npm trusted publishing and verify installation
        run: |
          npm install --global pnpm@12.4.2
          bash tools/publish-cli.sh

  release:
    name: Publish the completed GitHub Release
    needs: [prepare, publish, publish-images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the release source before final publication
        run: |
          bash tools/check-release.sh
          echo "CLI_RELEASE_DIRECTORY=$RUNNER_TEMP/cli" >> "$GITHUB_ENV"
          echo "RELEASE_IMAGES=$RUNNER_TEMP/release-images" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-cli
          path: ${{ env.CLI_RELEASE_DIRECTORY }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: ${{ env.CLI_RELEASE_DIRECTORY }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-manifest
          path: ${{ env.RELEASE_IMAGES }}
      - name: Attach verified downloads and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/publish-github-release.sh
