name: Publish Docker Hub images

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      tag:
        type: string
        required: true
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

cache-mode: none

defaults:
  run:
    shell: bash

env:
  RELEASE_TAG: ${{ inputs.tag }}
  PLATFORM_USAGE_REPORTING: "false"
  PLATFORM_CRASH_REPORTING: "false"
  WIDEFLEET_TELEMETRY_DISABLED: "1"

jobs:
  publish:
    if: github.repository == 'widefleet/widefleet'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the release again before publication
        run: |
          bash tools/check-release.sh
          echo "RELEASE_IMAGES=$RUNNER_TEMP/release-images" >> "$GITHUB_ENV"
      - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5
        with:
          version: v29.8.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-images-*
          merge-multiple: true
          path: ${{ env.RELEASE_IMAGES }}
      - name: Verify the transported images
        run: bash tools/load-release-images.sh
      - name: Authenticate to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Publish and verify anonymous digest pulls
        run: bash tools/publish-release-images.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest
          path: |
            ${{ env.RELEASE_IMAGES }}/widefleet-images-*.env
            ${{ env.RELEASE_IMAGES }}/widefleet-images-*.env.sha256
          if-no-files-found: error
          retention-days: 3
          overwrite: true
      - name: Remove registry credentials
        if: always()
        run: docker logout docker.io
