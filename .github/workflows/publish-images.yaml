name: Publish Docker Hub images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable GitHub release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
  PLATFORM_USAGE_REPORTING: "false"
  PLATFORM_CRASH_REPORTING: "false"
  WIDEFLEET_TELEMETRY_DISABLED: "1"

jobs:
  build:
    if: >-
      github.repository == 'widefleet/widefleet' &&
      ((github.event_name == 'release' && !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the published release and its main-branch source
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/check-release.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.8.2
          package-manager-cache: false
      - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5
        with:
          version: v29.8.1
      - name: Check source and prepare isolated tests
        run: |
          npm install --global pnpm@12.4.2
          pnpm install --frozen-lockfile
          pnpm check
          echo "RELEASE_IMAGES=$RUNNER_TEMP/release-images" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/release-images"
      - name: Recover or build the exact release images
        run: |
          for component in runtime agent control-plane sso; do
            bash tools/recover-release-image.sh "$component"
            image="docker.io/widefleet/widefleet-$component:$VERSION"
            if [[ "$(cat "$RELEASE_IMAGES/$component.existing")" == 0 ]]; then
              arguments=()
              if [[ "$component" == agent ]]; then
                arguments+=(--build-arg "RUNTIME_IMAGE=docker.io/widefleet/widefleet-runtime:$VERSION")
              fi
              docker build --platform linux/amd64 --file "infra/$component/Dockerfile" \
                --build-arg "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
                --label "org.opencontainers.image.source=https://github.com/widefleet/widefleet" \
                --label "org.opencontainers.image.revision=$REVISION" \
                --label "org.opencontainers.image.version=$VERSION" \
                --label "org.opencontainers.image.title=Widefleet $component" \
                --tag "$image" "${arguments[@]}" .
            fi
            docker image inspect "$image" --format '{{.Id}}' > "$RELEASE_IMAGES/$component.id"
          done
      - name: Test the packaged images with disposable services
        run: bash tools/test-release-images.sh
      - name: Export the tested images
        run: |
          for component in runtime agent control-plane sso; do
            docker save --output "$RELEASE_IMAGES/$component.tar" \
              "docker.io/widefleet/widefleet-$component:$VERSION"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-images
          path: ${{ env.RELEASE_IMAGES }}
          if-no-files-found: error
          compression-level: 1
          retention-days: 3
          overwrite: true
      - name: Stop disposable services
        if: always()
        run: docker compose -f infra/test/compose.yaml down --volumes

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.build.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the release again before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/check-release.sh
          echo "RELEASE_IMAGES=$RUNNER_TEMP/release-images" >> "$GITHUB_ENV"
      - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5
        with:
          version: v29.8.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-images
          path: ${{ env.RELEASE_IMAGES }}
      - name: Verify the transported images
        run: bash tools/load-release-images.sh
      - name: Authenticate to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Publish and verify anonymous digest pulls
        run: bash tools/publish-release-images.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: widefleet-images-${{ env.VERSION }}
          path: ${{ env.RELEASE_IMAGES }}/widefleet-images-*.env*
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Remove registry credentials
        if: always()
        run: docker logout docker.io
