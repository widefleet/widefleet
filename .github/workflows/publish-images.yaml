name: Publish Docker Hub images

on:
  release:
    types: [published]

permissions:
  contents: read

cache-mode: none

concurrency:
  group: publish-images-${{ github.event.release.tag_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RELEASE_TAG: ${{ github.event.release.tag_name }}
  PLATFORM_USAGE_REPORTING: "false"
  PLATFORM_CRASH_REPORTING: "false"
  WIDEFLEET_TELEMETRY_DISABLED: "1"

jobs:
  prepare:
    if: >-
      github.repository == 'widefleet/widefleet' &&
      !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the published release and its main-branch source
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/check-release.sh

  build:
    needs: prepare
    cache-mode: read
    uses: ./.github/workflows/build-release-images.yaml
    with:
      ref: ${{ needs.prepare.outputs.revision }}
      recover-existing: true

  publish:
    needs: [prepare, build]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the release again before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/check-release.sh
          echo "RELEASE_IMAGES=$RUNNER_TEMP/release-images" >> "$GITHUB_ENV"
      - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5
        with:
          version: v29.8.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-images-*
          merge-multiple: true
          path: ${{ env.RELEASE_IMAGES }}
      - name: Verify the transported images
        run: bash tools/load-release-images.sh
      - name: Authenticate to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Publish and verify anonymous digest pulls
        run: bash tools/publish-release-images.sh
      - name: Attach the digest manifest and checksum to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/upload-release-assets.sh \
            "$RELEASE_IMAGES/widefleet-images-$VERSION.env" \
            "$RELEASE_IMAGES/widefleet-images-$VERSION.env.sha256"
      - name: Remove registry credentials
        if: always()
        run: docker logout docker.io
