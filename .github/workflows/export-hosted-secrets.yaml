name: Export Hosted Secrets

on:
  workflow_dispatch:
    inputs:
      destination_vault:
        description: 1Password vault receiving the existing credentials
        required: true
        type: string
      destination_item:
        description: New 1Password item title
        required: true
        type: string
        default: hosted-widefleet
      confirm_transfer:
        description: Copy the existing credentials to the selected vault
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hosted-widefleet
  cancel-in-progress: false

jobs:
  export:
    if: github.ref == 'refs/heads/main' && inputs.confirm_transfer
    runs-on: ubuntu-24.04
    environment: hosted-widefleet
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: 1Password/install-cli-action@9a0c9dd934086b7ab1d90115d455bda1c53c2bdb # v2
        with:
          version: 2.41.0
      - name: Copy and verify the existing credentials
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TRANSFER_SERVICE_ACCOUNT_TOKEN }}
          DESTINATION_VAULT: ${{ inputs.destination_vault }}
          DESTINATION_ITEM: ${{ inputs.destination_item }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_PROVISIONING_TOKEN: ${{ secrets.CLOUDFLARE_PROVISIONING_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          PLATFORM_ENCRYPTION_KEY: ${{ secrets.PLATFORM_ENCRYPTION_KEY }}
          APP_COOKIE_SECRET: ${{ secrets.APP_COOKIE_SECRET }}
          WIDEFLEET_CONTROL_TOKEN: ${{ secrets.WIDEFLEET_CONTROL_TOKEN }}
          WIDEFLEET_CONNECTOR_KEY: ${{ secrets.WIDEFLEET_CONNECTOR_KEY }}
          PLATFORM_BOOTSTRAP: ${{ secrets.PLATFORM_BOOTSTRAP }}
        run: python3 tools/export-hosted-secrets.py
