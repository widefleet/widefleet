name: Check

on:
  # Keep application code and configuration (including the docs site) covered.
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "apps/docs/docs/**"

permissions:
  contents: read

cache-mode: none

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Main checks run in publish-cli.yaml so publication reuses their CLI artifacts.
  pull-request-checks:
    if: github.event_name == 'pull_request'
    cache-mode: read
    uses: ./.github/workflows/check-suites.yaml

  # Fails when actions.lock no longer matches the workflows or a locked commit
  # no longer verifies upstream. The pinned extension release is immutable.
  actions-lockfile:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.5.1
      - run: gh actions-lock --verify

  # Preserve the existing status check and require every suite to succeed.
  source-and-integration:
    runs-on: ubuntu-24.04
    needs: [pull-request-checks, actions-lockfile]
    if: always()
    steps:
      - name: Require all checks to pass
        env:
          PR_RESULT: ${{ needs.pull-request-checks.result }}
          LOCKFILE_RESULT: ${{ needs.actions-lockfile.result }}
        run: |
          [[ "$PR_RESULT" == success && "$LOCKFILE_RESULT" == success ]]
