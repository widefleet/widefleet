# Identity comes from the verified OIDC session. No OAuth token reaches an app.
reverse_proxy = true
email_domains = ["*"]
skip_provider_button = true
cookie_name = "__Secure-platform_sso"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "1h"
cookie_refresh = "0"
session_cookie_minimal = true
cookie_csrf_expire = "5m"
request_logging = false
auth_logging = false
standard_logging = true
show_debug_on_error = false
