name: widefleet-local

x-local: &local
  image: widefleet-local-tools:0.1.0
  build: { context: ../.., dockerfile: infra/local/Dockerfile }
  environment: &environment
    WIDEFLEET_LOCAL_DEMO: "1"
    DATABASE_URL: postgres://widefleet:local-demo-only@postgres:5432/widefleet_local
    PLATFORM_USAGE_REPORTING: "false"
    PLATFORM_CRASH_REPORTING: "false"
    WIDEFLEET_TELEMETRY_DISABLED: "1"
    PLATFORM_URL: http://localhost:25450
    APP_DOMAIN: apps.localhost
    APP_HTTPS_PORT: "25453"
    S3_ENDPOINT: http://storage:9000
    S3_BUCKET: local-artifacts
    FLEET_S3_BUCKET: local-fleets
    S3_ACCESS_KEY_ID: local-demo
    S3_SECRET_ACCESS_KEY: local-demo-only
    BETTER_AUTH_SECRET: local-demo-only-never-use-in-a-real-installation
    PLATFORM_STATE_DIRECTORY: /data/platform
    PLATFORM_AUTH_DIRECTORY: /data/platform/auth
    CLICKHOUSE_URL: http://clickhouse:8123
    CLICKHOUSE_USER: widefleet_reader
    CLICKHOUSE_PASSWORD: local-reader-only
    OTEL_COLLECTOR_URL: http://otel-collector:4318
  volumes: ["${WIDEFLEET_LOCAL_DATA:?Run ./dev}:/data"]

services:
  postgres:
    image: postgres:18.1
    environment:
      POSTGRES_USER: widefleet
      POSTGRES_DB: widefleet_local
      POSTGRES_PASSWORD: local-demo-only
    volumes: ["postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U widefleet -d widefleet_local"]
      interval: 1s
      timeout: 3s
      retries: 30
  storage:
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    container_name: widefleet-local-storage
    environment:
      RUSTFS_ACCESS_KEY: local-demo
      RUSTFS_SECRET_KEY: local-demo-only
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOGGER_LEVEL: warn
    volumes: ["objects:/data"]
    tmpfs: ["/logs:uid=10001,gid=10001"]
  proxy:
    image: traefik:v3.7.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
    container_name: widefleet-local-proxy
    command:
      - --entrypoints.management.address=:25450
      - --entrypoints.websecure.address=:25453
      - --providers.file.directory=/routes
      - --providers.file.watch=true
    ports:
      - 127.0.0.1:25450:25450
      - 127.0.0.1:25452:25452
      - 127.0.0.1:25453:25453
    volumes: ["${WIDEFLEET_LOCAL_DATA}/routes:/routes:ro"]
  identity:
    <<: *local
    network_mode: service:proxy
    command: ["node", "local/identity-provider.ts"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "--input-type=module",
          "--eval",
          "import {access} from 'node:fs/promises'; await access('/data/identity.env'); if (!(await fetch('http://localhost:25452/.well-known/openid-configuration')).ok) process.exit(1)",
        ]
      interval: 1s
      timeout: 3s
      retries: 30
  control-plane:
    <<: *local
    network_mode: service:proxy
    command: ["node", "--env-file=/data/identity.env", "build"]
    environment:
      <<: *environment
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: "3000"
      BODY_SIZE_LIMIT: 100M
      PROTOCOL_HEADER: x-forwarded-proto
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "--eval",
          "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 1s
      timeout: 3s
      retries: 30
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
    network_mode: service:proxy
    command:
      - --config=/config/options.cfg
      - --alpha-config=/config/oauth2-proxy.json
      - --cookie-domain=.apps.localhost
      - --whitelist-domain=.apps.localhost:25453
      - --redirect-url=https://auth.apps.localhost:25453/oauth2/callback
    environment:
      OAUTH2_PROXY_COOKIE_SECRET: bG9jYWwtZGVtby1vbmx5LW5vdC1mb3ItcmVhbC11c2U=
    volumes:
      - ${WIDEFLEET_LOCAL_DATA}:/config:ro
      - ${WIDEFLEET_LOCAL_DATA}/client-secret:/run/secrets/app_entra_client_secret:ro
  app-authorizer:
    <<: *local
    network_mode: service:proxy
    command: ["node", "local/app-authorizer.ts"]
  agent:
    <<: *local
    network_mode: service:proxy
    command: ["node", "--env-file=/data/identity.env", "local/control.ts", "agent"]
    environment:
      <<: *environment
      DOCKER_HOST: unix:///var/run/docker.sock
      PLATFORM_AGENT_STATE: /data/agent
      PLATFORM_AGENT_HOST_STATE: ${WIDEFLEET_LOCAL_DATA}/agent
      PLATFORM_ROUTING_DIRECTORY: /data/routes
      CELLD_BINARY: /usr/local/bin/celld
      FLEET_S3_ENDPOINT: http://storage:9000
      FLEET_RUNTIME_S3_ENDPOINT: http://widefleet-local-storage:9000
      FLEET_S3_REGION: us-east-1
      FLEET_S3_BUCKET: local-fleets
      FLEET_S3_ACCESS_KEY_ID: local-demo
      FLEET_S3_SECRET_ACCESS_KEY: local-demo-only
      PLATFORM_TRUSTED_CONTAINERS: widefleet-local-proxy,widefleet-local-storage
      PLATFORM_PROXY_URL: https://widefleet-local-proxy:25453
      PLATFORM_APP_AUTH_URL: http://127.0.0.1:4181/
      PLATFORM_RUNTIME_PLATFORM_URL: http://widefleet-local-proxy:25450
    volumes:
      - ${WIDEFLEET_LOCAL_DATA}:/data
      - ${WIDEFLEET_DOCKER_SOCKET:?Run ./dev}:/var/run/docker.sock
    stop_grace_period: 45s
  tools:
    <<: *local
    profiles: [tools]
    network_mode: service:proxy
    command: ["node", "--env-file=/data/identity.env", "local/control.ts", "cli", "apps"]
  configure:
    <<: *local
    profiles: [tools]
    command: ["node", "local/configure.ts"]
    volumes:
      - ${WIDEFLEET_LOCAL_DATA}:/data
      - otel-queue:/telemetry-queue

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.18.2@sha256:d97c9867f770fab06113bfe82f2cd17dcc9535f0773972469a2464b4fefc6a48
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      CLICKHOUSE_READ_PASSWORD: local-reader-only
      CLICKHOUSE_INGEST_PASSWORD: local-ingest-only
    volumes:
      - clickhouse:/var/lib/clickhouse
      - ../telemetry/users.xml:/etc/clickhouse-server/users.d/widefleet.xml:ro
      - ../telemetry/schema.sql:/docker-entrypoint-initdb.d/001-widefleet.sql:ro
    healthcheck:
      test: [CMD, clickhouse-client, --query, "SELECT 1 FROM widefleet.runtime_logs LIMIT 0"]
      interval: 1s
      timeout: 3s
      retries: 30
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
    user: "10001:10001"
    command: [--config=/etc/otelcol/config.yaml]
    environment:
      CLICKHOUSE_INGEST_PASSWORD: local-ingest-only
    volumes:
      - ../telemetry/collector.yaml:/etc/otelcol/config.yaml:ro
      - otel-queue:/var/lib/otelcol
    depends_on:
      clickhouse: { condition: service_healthy }

volumes:
  postgres:
  objects:
  clickhouse:
  otel-queue:
