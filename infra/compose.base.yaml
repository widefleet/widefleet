name: app-platform

x-control-plane: &control-plane
  image: ${PLATFORM_CONTROL_PLANE_IMAGE:?Load the release images environment file}
  environment:
    DATABASE_URL: ${DATABASE_URL:-}
    PLATFORM_URL: ${PLATFORM_URL:?Set PLATFORM_URL}
    PLATFORM_USAGE_REPORTING: ${PLATFORM_USAGE_REPORTING:-}
    PLATFORM_CRASH_REPORTING: ${PLATFORM_CRASH_REPORTING:-}
    APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    PLATFORM_CONFIG_DIRECTORY: /var/lib/widefleet/edge
    PLATFORM_RUNTIME_DIRECTORY: /var/lib/widefleet/runtime
    PLATFORM_ENCRYPTION_KEY: ${PLATFORM_ENCRYPTION_KEY:-}
  volumes:
    - platform-state:/var/lib/widefleet
    - edge-config:/var/lib/widefleet/edge
    - runtime-config:/var/lib/widefleet/runtime
  networks: [management, edge]

services:
  initialize:
    <<: *control-plane
    command: [sh, -ec, "node tools/initialize-storage.ts && node tools/prepare-installation.ts"]

  control-plane:
    <<: *control-plane
    restart: unless-stopped
    depends_on:
      runtime: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          --eval,
          "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  runtime:
    container_name: app-platform-runtime
    image: ${PLATFORM_RUNTIME_IMAGE:?Load the release images environment file}
    restart: unless-stopped
    depends_on:
      initialize: { condition: service_completed_successfully }
    volumes:
      - runtime-config:/runtime-config:ro
      - runtime-state:/state
      - ${PLATFORM_DATA_DIRECTORY}/agent:/agent-state:ro
    networks: [management, edge]
    stop_grace_period: 45s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=64m"]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8081/state]
      interval: 5s
      timeout: 3s
      retries: 12

  proxy:
    image: traefik:v3.7.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
    container_name: app-platform-proxy
    restart: unless-stopped
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        until [ -s /config/traefik.json ]; do sleep 1; done
        exec traefik --configFile=/config/traefik.json
    ports: ["80:8080", "443:8443"]
    volumes:
      - edge-config:/config:ro
      - ${PLATFORM_DATA_DIRECTORY}/tls:/tls:ro
    networks: [edge]

  agent:
    image: ${PLATFORM_AGENT_IMAGE:?Load the release images environment file}
    profiles: [agent]
    restart: unless-stopped
    depends_on:
      runtime: { condition: service_healthy }
    environment:
      PLATFORM_URL: ${PLATFORM_URL}
      PLATFORM_USAGE_REPORTING: ${PLATFORM_USAGE_REPORTING:-}
      PLATFORM_CRASH_REPORTING: ${PLATFORM_CRASH_REPORTING:-}
      PLATFORM_AGENT_TOKEN: ${PLATFORM_AGENT_TOKEN:-}
      DOCKER_HOST: unix:///var/run/docker.sock
      PLATFORM_AGENT_STATE: /state
      PLATFORM_ROUTING_DIRECTORY: /config/routes
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      CELLD_BINARY: /usr/local/bin/celld
      PLATFORM_RUNTIME_CONTAINER: app-platform-runtime
    volumes:
      - ${DOCKER_SOCKET_FILE:?Set the Docker socket path}:/var/run/docker.sock
      - ${PLATFORM_DATA_DIRECTORY}/agent:/state
      - edge-config:/config
      - runtime-config:/runtime-config:ro
    networks: [management]
    stop_grace_period: 45s

networks:
  management:
  edge:

volumes:
  platform-state:
  edge-config:
  runtime-config:
  runtime-state:
