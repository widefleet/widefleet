services:
  control-plane:
    environment:
      ARTIFACT_STORAGE_PROVIDER: gcs
      FLEET_STORAGE_PROVIDER: gcs
      GCS_BUCKET: ${GCS_BUCKET:?Set GCS_BUCKET}
      FLEET_GCS_BUCKET: ${FLEET_GCS_BUCKET:?Set FLEET_GCS_BUCKET}
      GOOGLE_APPLICATION_CREDENTIALS:
  agent:
    environment:
      FLEET_STORAGE_PROVIDER: gcs
      FLEET_GCS_BUCKET: ${FLEET_GCS_BUCKET}
      GOOGLE_APPLICATION_CREDENTIALS:
