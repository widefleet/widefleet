services:
  control-plane:
    environment:
      ARTIFACT_STORAGE_PROVIDER: s3
      FLEET_STORAGE_PROVIDER: s3
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-platform-artifacts}
      FLEET_S3_BUCKET: ${FLEET_S3_BUCKET:-platform-fleets}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
  agent:
    environment:
      FLEET_STORAGE_PROVIDER: s3
      FLEET_S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:9000}
      FLEET_RUNTIME_S3_ENDPOINT: ${FLEET_RUNTIME_S3_ENDPOINT:-${S3_ENDPOINT:-http://app-platform-storage:9000}}
      FLEET_S3_REGION: ${S3_REGION:-us-east-1}
      FLEET_S3_BUCKET: ${FLEET_S3_BUCKET:-platform-fleets}
      FLEET_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      FLEET_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
