# For GCS service-account files or Azure workload-identity token files.
# The provider's file environment variable must point at this container path.
services:
  control-plane:
    volumes:
      - type: bind
        source: ${FLEET_CREDENTIAL_HOST_FILE:?Set the absolute host credential path}
        target: /run/widefleet/storage-credential
        read_only: true
        bind: { create_host_path: false }
  agent:
    environment:
      FLEET_CREDENTIAL_HOST_FILE: ${FLEET_CREDENTIAL_HOST_FILE}
    volumes:
      - type: bind
        source: ${FLEET_CREDENTIAL_HOST_FILE}
        target: /run/widefleet/storage-credential
        read_only: true
        bind: { create_host_path: false }
