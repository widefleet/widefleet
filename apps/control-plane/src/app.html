<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="%sveltekit.assets%/favicon-dark.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="%sveltekit.assets%/favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <!-- Rendered once from favicon.svg by crates/platform-app-icons, opaque because
         iOS shows transparency as black. Root paths: browsers fetch these on install, after
         client-side navigation has changed the base of SvelteKit's relative asset paths. -->
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
